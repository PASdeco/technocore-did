name: tclk-live
on:
  schedule: [{cron: "*/20 * * * *"}]
  workflow_dispatch:
jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm i @flop-labs/tclk @flop-labs/tclk-mcp
      - run: node auto_worker.mjs
        env:
          TECHNOCORE_SIGNING_KEY: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TECHNOCORE_URL: https://technocore.chat
